name: love_contador_do_amor
description: "Contador do amor."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.38
  characters: 1.4.0
  matcher: 0.12.17
  material_color_utilities: 0.11.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - ativos/musica/
    - ativos/imagens/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/cosmico.png"
  min_sdk_android: 21 # ou superior
